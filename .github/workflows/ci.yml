name: canfar-containers CI

# Docker-free gate for the ray-manager module. Image build/test pipelines
# remain operator-side via the Makefile (`make build-all`, `make test-local`,
# `make test-canfar`, …). Image Python deps float at build from config/*.txt
# (no committed package lockfiles).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  manager-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync manager project (runtime + dev deps)
        working-directory: ray/manager
        run: uv sync --group dev --quiet

      - name: Ruff
        working-directory: ray/manager
        run: uv run ruff check .

      - name: Pytest (ray-manager unit tests)
        working-directory: ray/manager
        run: uv run pytest tests/ -q

      - name: Docker-free host tests
        run: make test-host
